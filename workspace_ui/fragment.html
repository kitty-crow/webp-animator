        <!-- Exists before workspace.js runs so IndexedDB can save/restore it. JS

          <span><input id="temporalRepairAudit" type="checkbox"> Audit + repair every generated/interpolated frame</span>
          <span class="hint">CUDA ProPainter temporal repair. Original source frames are never rewritten; only automatically created frames are audited and repaired from their neighbours.</span>
        </label>
        <script>
          window.addEventListener("DOMContentLoaded", () => {
            const body = document.body;
            const main = document.querySelector("main");
            if (body && main) {
              body.classList.add("pages-body");
              main.classList.add("pages-main");
              main.id = main.id || "content";

              if (!document.querySelector(".pages-skip")) {
                const skip = document.createElement("a");
                skip.className = "pages-skip";
                skip.href = "#content";
                skip.textContent = "Skip to content";
                body.prepend(skip);
              }

              if (!document.querySelector("[data-pages-header]")) {
                const header = document.createElement("header");
                header.className = "pages-header";
                header.dataset.pagesHeader = "";
                header.innerHTML = `
                  <div class="pages-header__inner">
                    <a class="pages-brand" href="/">WebP Animator</a>
                    <nav class="pages-nav" aria-label="Primary navigation">
                      <a href="/" aria-current="page">Animator</a>
                      <a href="https://github.com/kitty-crow/webp-animator">GitHub</a>
                    </nav>
                    <button class="pages-theme" type="button" data-theme-toggle aria-pressed="false" aria-label="Toggle light and dark theme">
                      <span class="pages-theme__track" aria-hidden="true"><span class="pages-theme__thumb"></span></span>
                      <span data-theme-label aria-hidden="true">☀️</span>
                    </button>
                  </div>`;
                body.insertBefore(header, main);
              }

              if (!document.querySelector(".pages-footer")) {
                const footer = document.createElement("footer");
                footer.className = "pages-footer";
                footer.innerHTML = `
                  <span>WebP Animator</span>
                  <span data-pages-footer-links><a href="https://github.com/kitty-crow/webp-animator">GitHub</a></span>`;
                main.insertAdjacentElement("afterend", footer);
              }

              const themeKey = "webp-animator.theme";
              const media = window.matchMedia?.("(prefers-color-scheme: dark)");
              const toggle = document.querySelector("[data-theme-toggle]");
              const label = document.querySelector("[data-theme-label]");
              const themeMeta = document.querySelector('meta[name="theme-color"]');
              const readSavedTheme = () => {
                try { return localStorage.getItem(themeKey); } catch { return null; }
              };
              const applyTheme = (theme, persist = false) => {
                const next = theme === "dark" ? "dark" : "light";
                document.documentElement.dataset.theme = next;
                if (toggle) {
                  toggle.dataset.themeState = next;
                  toggle.setAttribute("aria-pressed", String(next === "dark"));
                }
                if (label) label.textContent = next === "dark" ? "🌙" : "☀️";
                if (themeMeta) themeMeta.content = next === "dark" ? "#11131a" : "#f5f6f8";
                if (persist) {
                  try { localStorage.setItem(themeKey, next); } catch {}
                }
              };
              applyTheme(document.documentElement.dataset.theme || (media?.matches ? "dark" : "light"));
              toggle?.addEventListener("click", () => {
                applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
              });
              media?.addEventListener?.("change", event => {
                if (!readSavedTheme()) applyTheme(event.matches ? "dark" : "light");
              });
            }

            const control = document.getElementById("temporalRepairControl");
            const checkbox = document.getElementById("temporalRepairAudit");
            const form = document.getElementById("form");
            const target = document.getElementById("targetGaps");
            const grid = document.querySelector(".advanced-engine-grid");
            if (!control || !checkbox || !form) return;

            if (grid) grid.appendChild(control);
            else form.appendChild(control);
            control.hidden = false;

            const token = "repair:propainter";
            const hasToken = value => String(value || "").split(",").some(part => part.trim().toLowerCase() === token);
            if (target && hasToken(target.value)) checkbox.checked = true;
            target?.addEventListener("change", () => {
              if (hasToken(target.value)) checkbox.checked = true;
            });

            // app_all deliberately whitelists render settings. Encode this optional
            // repair flag in target_gaps at FormData construction time; the gap
            // parser ignores non-gap tokens, while temporal_repair consumes it.
            form.addEventListener("formdata", event => {
              const data = event.formData;
              const parts = String(data.get("target_gaps") || "")
                .split(",")
                .map(part => part.trim())
                .filter(part => part && part.toLowerCase() !== token);
              if (checkbox.checked) parts.push(token);
              data.set("target_gaps", parts.join(","));
            });
          });
        </script>
