        (() => {
          const key = "webp-animator.theme";
          let saved = null;
          try { saved = localStorage.getItem(key); } catch {}
          const dark = saved === "dark" || (saved !== "light" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();

          .pipeline-title strong { margin-right: auto; }
          .pipeline-add, .pipeline-row button { width: auto !important; margin: 0 !important; padding: 7px 9px !important; border-radius: 8px !important; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent) !important; background: Canvas !important; color: CanvasText !important; font-weight: 750 !important; }
          .pipeline-list { display: grid; gap: 7px; }

          .pipeline-row select { min-width: 0; width: 100%; }

          #temporalRepairControl { display: grid; gap: 7px; }
          @media (max-width: 620px) {
            .pages-header__inner { grid-template-columns: 1fr auto; gap: .5rem; }
            .pages-nav { display: none; }
            .pages-footer { flex-direction: column; }
            .pipeline-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }
            .pipeline-row [data-pipeline-remove] { grid-column: 2 / -1; justify-self: end; }
          }
        </style>

          <input id="globalRestoreId" type="text" placeholder="Restore global job ID" aria-label="Restore global job ID">
          <button type="button" id="globalRestore">Restore job</button>

        <div class="workspace-note" id="globalJobStatus">Frames, settings and the latest finished WebP are kept with this job. A new job gets a new ID; previous IDs remain recoverable.</div>

        <label id="temporalRepairControl" class="wide" hidden>
          Frame repair
          <select id="temporalRepairEngine" aria-label="Frame repair engine">
            <option value="none">None</option>
            <option value="propainter">ProPainter</option>
          </select>
          <span class="hint">A Repair pass runs ProPainter on generated/interpolated frames already present at that point in the pipeline.</span>
        </label>
        <input id="temporalPipelineState" type="hidden" value="gap,repair,interpolate">
        <script>
          window.addEventListener("DOMContentLoaded", () => {
            const body = document.body;
            const main = document.querySelector("main");
            if (body && main) {
              body.classList.add("pages-body");
              main.classList.add("pages-main");
              main.id = main.id || "content";

              if (!document.querySelector(".pages-skip")) {
                const skip = document.createElement("a");
                skip.className = "pages-skip";
                skip.href = "#content";
                skip.textContent = "Skip to content";
                body.prepend(skip);
              }
              if (!document.querySelector("[data-pages-header]")) {
                const header = document.createElement("header");
                header.className = "pages-header";
                header.dataset.pagesHeader = "";
                header.innerHTML = `<div class="pages-header__inner"><a class="pages-brand" href="/">WebP Animator</a><nav class="pages-nav" aria-label="Primary navigation"><a href="/" aria-current="page">Animator</a><a href="https://github.com/kitty-crow/webp-animator">GitHub</a></nav><button class="pages-theme" type="button" data-theme-toggle aria-pressed="false" aria-label="Toggle light and dark theme"><span class="pages-theme__track" aria-hidden="true"><span class="pages-theme__thumb"></span></span><span data-theme-label aria-hidden="true">☀️</span></button></div>`;
                body.insertBefore(header, main);
              }
              if (!document.querySelector(".pages-footer")) {
                const footer = document.createElement("footer");
                footer.className = "pages-footer";
                footer.innerHTML = `<span>WebP Animator</span><span data-pages-footer-links><a href="https://github.com/kitty-crow/webp-animator">GitHub</a></span>`;
                main.insertAdjacentElement("afterend", footer);
              }

              const themeKey = "webp-animator.theme";
              const media = window.matchMedia?.("(prefers-color-scheme: dark)");
              const toggle = document.querySelector("[data-theme-toggle]");
              const label = document.querySelector("[data-theme-label]");
              const themeMeta = document.querySelector('meta[name="theme-color"]');
              const readSavedTheme = () => { try { return localStorage.getItem(themeKey); } catch { return null; } };
              const applyTheme = (theme, persist = false) => {
                const next = theme === "dark" ? "dark" : "light";
                document.documentElement.dataset.theme = next;
                if (toggle) { toggle.dataset.themeState = next; toggle.setAttribute("aria-pressed", String(next === "dark")); }
                if (label) label.textContent = next === "dark" ? "🌙" : "☀️";
                if (themeMeta) themeMeta.content = next === "dark" ? "#11131a" : "#f5f6f8";
                if (persist) { try { localStorage.setItem(themeKey, next); } catch {} }
              };
              applyTheme(document.documentElement.dataset.theme || (media?.matches ? "dark" : "light"));
              toggle?.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
              media?.addEventListener?.("change", event => { if (!readSavedTheme()) applyTheme(event.matches ? "dark" : "light"); });
            }

            const control = document.getElementById("temporalRepairControl");
            const repairEngine = document.getElementById("temporalRepairEngine");
            const form = document.getElementById("form");
            const target = document.getElementById("targetGaps");
            const grid = document.querySelector(".advanced-engine-grid");
            const generator = document.getElementById("frameGenerator");
            const interpolator = document.getElementById("interpolator");
            const pipelineState = document.getElementById("temporalPipelineState");
            if (!control || !repairEngine || !form || !pipelineState) return;

            if (grid) grid.appendChild(control);
            else form.appendChild(control);
            control.hidden = false;

            const repairTokens = new Set(["repair:propainter"]);
            const pipelinePrefix = "pipeline:";
            const partsOf = value => String(value || "").split(",").map(part => part.trim()).filter(Boolean);
            const savedRepairToken = partsOf(target?.value).find(part => repairTokens.has(part.toLowerCase()));
            const savedPipelineToken = partsOf(target?.value).find(part => part.toLowerCase().startsWith(pipelinePrefix));
            if (savedRepairToken) repairEngine.value = savedRepairToken.toLowerCase().split(":", 2)[1] || "none";
            if (savedPipelineToken) pipelineState.value = savedPipelineToken.slice(pipelinePrefix.length).replace(/[>|]/g, ",");

            const editor = document.createElement("section");
            editor.className = "pipeline-editor wide";
            editor.innerHTML = `<div class="pipeline-title"><strong>Temporal operation order</strong><button type="button" class="pipeline-add" id="pipelineAdd">+ Add pass</button></div><div class="pipeline-list" id="pipelineList"></div><div class="pipeline-hint">Up to four passes. Default: Gap filling → Frame repair → Interpolation. Each pass consumes the output of the previous pass, and repeated pass types are intentional.</div>`;
            if (grid) grid.appendChild(editor);
            else control.insertAdjacentElement("afterend", editor);

            const list = editor.querySelector("#pipelineList");
            const addButton = editor.querySelector("#pipelineAdd");
            const choices = [["gap", "Gap filling"], ["repair", "Frame repair"], ["interpolate", "Interpolation"]];
            const MAX_PASSES = 4;

            function normalisePipeline(value) {
              const valid = new Set(choices.map(item => item[0]));
              const parsed = partsOf(value).map(part => part.toLowerCase()).filter(part => valid.has(part)).slice(0, MAX_PASSES);
              return parsed.length ? parsed : ["gap", "repair", "interpolate"];
            }

            function syncState() {
              const rows = [...list.querySelectorAll(".pipeline-row")];
              rows.forEach((row, index) => {
                row.querySelector(".pipeline-number").textContent = `Pass ${index + 1}`;
                row.querySelector("[data-pipeline-up]").disabled = index === 0;
                row.querySelector("[data-pipeline-down]").disabled = index === rows.length - 1;
              });
              addButton.disabled = rows.length >= MAX_PASSES;
              pipelineState.value = rows.map(row => row.querySelector("select").value).join(",");
              pipelineState.dispatchEvent(new Event("change", { bubbles: true }));
            }

            function makeRow(value = "gap") {
              const row = document.createElement("div");
              row.className = "pipeline-row";
              const options = choices.map(([id, text]) => `<option value="${id}"${id === value ? " selected" : ""}>${text}</option>`).join("");
              row.innerHTML = `<span class="pipeline-number">Pass</span><select aria-label="Temporal pass type">${options}</select><button type="button" data-pipeline-up aria-label="Move pass up">↑</button><button type="button" data-pipeline-down aria-label="Move pass down">↓</button><button type="button" data-pipeline-remove aria-label="Remove pass">Remove</button>`;
              row.querySelector("select").addEventListener("change", syncState);
              row.querySelector("[data-pipeline-up]").addEventListener("click", () => { const previous = row.previousElementSibling; if (previous) list.insertBefore(row, previous); syncState(); });
              row.querySelector("[data-pipeline-down]").addEventListener("click", () => { const next = row.nextElementSibling; if (next) list.insertBefore(next, row); syncState(); });
              row.querySelector("[data-pipeline-remove]").addEventListener("click", () => { row.remove(); syncState(); });
              return row;
            }

            function rebuild(value) {
              list.replaceChildren();
              normalisePipeline(value).forEach(operation => list.appendChild(makeRow(operation)));
              syncState();
            }

            addButton.addEventListener("click", () => {
              if (list.querySelectorAll(".pipeline-row").length >= MAX_PASSES) return;
              list.appendChild(makeRow("gap"));
              syncState();
            });
            pipelineState.addEventListener("change", event => {
              if (event.target !== pipelineState || pipelineState.dataset.syncing === "1") return;
              const current = [...list.querySelectorAll("select")].map(select => select.value).join(",");
              if (current === pipelineState.value) return;
              pipelineState.dataset.syncing = "1";
              rebuild(pipelineState.value);
              delete pipelineState.dataset.syncing;
            });
            rebuild(pipelineState.value);

            target?.addEventListener("change", () => {
              const values = partsOf(target.value);
              const token = values.find(part => repairTokens.has(part.toLowerCase()));
              if (token) repairEngine.value = token.toLowerCase().split(":", 2)[1] || "none";
              const pipelineToken = values.find(part => part.toLowerCase().startsWith(pipelinePrefix));
              if (pipelineToken) rebuild(pipelineToken.slice(pipelinePrefix.length).replace(/[>|]/g, ","));
            });

            form.addEventListener("formdata", event => {
              const data = event.formData;
              const baseParts = partsOf(data.get("target_gaps")).filter(part => {
                const lower = part.toLowerCase();
                return !lower.startsWith("repair:") && !lower.startsWith(pipelinePrefix);
              });
              if (repairEngine.value === "propainter") baseParts.push("repair:propainter");
              const active = [...list.querySelectorAll("select")]
                .map(select => select.value)
                .filter(operation => {
                  if (operation === "repair") return repairEngine.value === "propainter";
                  if (operation === "gap") return generator?.value && generator.value !== "none";
                  if (operation === "interpolate") return interpolator?.value && interpolator.value !== "none";
                  return false;
                });
              if (active.length) baseParts.push(`${pipelinePrefix}${active.slice(0, MAX_PASSES).join(">")}`);
              data.set("target_gaps", baseParts.join(","));
            });
          });
        </script>
      </section>
      <script src="/live-run-ui.js" defer></script>
