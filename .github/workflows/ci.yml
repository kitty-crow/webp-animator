name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax and persistent app import
        run: |
          python -m py_compile app.py app_all.py global_jobs.py anim_align_webp.py frame1_optimizer.py rife_worker.py setup_rife.py
          python - <<'PY'
          import app_all
          assert b"Recoverable job" in app_all.INDEX_HTML
          assert b"Final WebP preview" in app_all.INDEX_HTML
          assert b"workspace-ui.js" in app_all.INDEX_HTML
          PY

      - name: Test durable jobs and frame-1 optimiser
        run: python -m unittest -v test_global_jobs.py test_frame1_optimizer.py

      - name: Ensure retired semantic interpolator is gone
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -i 'open''ai'; then
            echo 'Retired semantic-interpolator files are still tracked.' >&2
            exit 1
          fi
          if git grep -n -i 'open''ai' -- .; then
            echo 'Retired semantic-interpolator references are still present.' >&2
            exit 1
          fi
