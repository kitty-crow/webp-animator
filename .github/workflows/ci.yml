name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax, browser scripts and persistent app import
        run: |
          python -m py_compile \
            app.py app_all.py global_jobs.py anim_align_webp.py frame1_optimizer.py \
            rife_worker.py rife_selective_worker.py amt_worker.py eden_worker.py speed_worker.py \
            resshift_selective_worker.py mog_selective_worker.py mog_selective_worker_v2.py \
            tooncrafter_selective_worker.py generative_vfi.py generative_vfi_restore.py generative_models_ui.py tooncrafter_vfi.py \
            advanced_pipeline.py temporal_v2.py engine_paths.py gpu_match.py smart_frames.py \
            webp_fast.py worker_common.py temporal_timing.py engine_progress.py looped_animation.py geometry_cache.py \
            job_control.py live_timeline.py operation_pipeline.py pipeline_live.py pipeline_settings.py \
            temporal_repair.py propainter_repair_worker.py timeline_pipeline.py analysis_upload_reuse.py \
            setup_rife.py setup_engine_common.py setup_acceleration.py setup_amt.py setup_eden.py setup_speed.py setup_propainter.py \
            setup_resshift.py setup_mog.py setup_tooncrafter.py
          node --check advanced_ui.js
          node --check live_run_ui.js
          node --check workspace_ui/workspace.js
          python - <<'PY'
          import app_all
          assert b"Recoverable job" in app_all.INDEX_HTML
          assert b"Final WebP preview" in app_all.INDEX_HTML
          assert b"workspace-ui.js" in app_all.INDEX_HTML
          assert b"advanced-ui.js?v=generative-models-v2" in app_all.INDEX_HTML
          assert b"Looped animation" in app_all.WORKSPACE_SCRIPT
          assert b"analysis-upload-reuse-ui-v2" in app_all.ADVANCED_SCRIPT
          assert b"generative-vfi-ui-v1" in app_all.ADVANCED_SCRIPT
          assert b"generative-vfi-restore-ui-v2" in app_all.ADVANCED_SCRIPT
          assert b"generative-models-ui-v2" in app_all.ADVANCED_SCRIPT
          assert b"tooncrafter" in app_all.ADVANCED_SCRIPT
          assert b"OpenAI repair" not in app_all.INDEX_HTML
          PY

      - name: Test durable jobs, geometry, temporal pipeline, repair and WebP encoding
        run: >-
          python -m unittest -v
          test_global_jobs.py
          test_frame1_optimizer.py
          test_webp_fast.py
          test_smart_frames.py
          test_advanced_features.py
          test_temporal_v2.py
          test_operation_pipeline.py
          test_live_timeline.py
          test_looped_animation.py
          test_geometry_cache.py
          test_analysis_upload_reuse.py
          test_generative_vfi.py

      - name: Ensure retired OpenAI systems stay absent
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            app_openai.py
            openai_interrogator.py
            openai_batch.py
            openai_job_features.py
            resilient_bridge.py
            openai_bridge
            openai_ui
            vendor/openai-schema
            openai_repair.py
            openai_repair_context.py
            openai_repair_http.py
            openai_repair_ui.js
            repair_mode.py
            test_openai_repair.py
            test_repair_mode.py
            test_manual_repair_persistence.py
          )
          for path in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1 || git ls-files "$path/*" | grep -q .; then
              echo "Retired OpenAI path is tracked: $path" >&2
              exit 1
            fi
          done
          echo "Retired OpenAI systems remain absent."
