name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax, browser script and persistent app import
        run: |
          python -m py_compile \
            app.py app_all.py global_jobs.py anim_align_webp.py frame1_optimizer.py \
            rife_worker.py rife_selective_worker.py amt_worker.py eden_worker.py speed_worker.py \
            advanced_pipeline.py temporal_v2.py engine_paths.py gpu_match.py smart_frames.py \
            webp_fast.py worker_common.py temporal_timing.py \
            setup_rife.py setup_engine_common.py setup_acceleration.py setup_amt.py setup_eden.py setup_speed.py
          node --check advanced_ui.js
          python - <<'PY'
          import app_all
          assert b"Recoverable job" in app_all.INDEX_HTML
          assert b"Final WebP preview" in app_all.INDEX_HTML
          assert b"workspace-ui.js" in app_all.INDEX_HTML
          assert b"advanced-ui.js" in app_all.INDEX_HTML
          PY

      - name: Test durable jobs, geometry, smart frames and WebP encoding
        run: >-
          python -m unittest -v
          test_global_jobs.py
          test_frame1_optimizer.py
          test_webp_fast.py
          test_smart_frames.py
          test_advanced_features.py
          test_temporal_v2.py

      - name: Ensure retired semantic interpolator is gone
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -i 'open''ai'; then
            echo 'Retired semantic-interpolator files are still tracked.' >&2
            exit 1
          fi
          if git grep -n -i 'open''ai' -- .; then
            echo 'Retired semantic-interpolator references are still present.' >&2
            exit 1
          fi
