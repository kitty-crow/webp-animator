name: Browser model assets

on:
  push:
    branches: [feat/browser-adaptive-wasm]
    paths:
      - '.github/workflows/browser-model-assets.yml'
      - 'browser/export/export_amt.py'
      - 'browser/export/export_resshift.py'
      - 'browser/export/export_eden.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amt:
    name: Export AMT-S
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebP Animator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.17.0 omegaconf==2.3.0

      - name: Fetch official AMT source and checkpoint
        run: |
          git clone --depth 1 https://github.com/MCG-NKU/AMT.git /tmp/AMT
          mkdir -p /tmp/AMT/pretrained
          curl --fail --location --retry 3 \
            https://huggingface.co/lalala125/AMT/resolve/main/amt-s.pth \
            --output /tmp/AMT/pretrained/amt-s.pth
          git -C /tmp/AMT rev-parse HEAD
          sha256sum /tmp/AMT/pretrained/amt-s.pth

      - name: Export AMT-S browser graphs
        run: |
          rm -rf /tmp/browser-amt-v1
          python browser/export/export_amt.py \
            --source /tmp/AMT \
            --config /tmp/AMT/cfgs/AMT-S.yaml \
            --checkpoint /tmp/AMT/pretrained/amt-s.pth \
            --output /tmp/browser-amt-v1

      - name: Include upstream licence
        run: cp /tmp/AMT/LICENSE /tmp/browser-amt-v1/LICENSE-AMT.txt

      - name: Verify model package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/browser-amt-v1')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['family'] == 'amt'
          assert manifest['licence'] == 'CC-BY-NC-4.0'
          assert len(manifest['scales']) == 4
          for asset in manifest['assets']:
              path = root / asset['path']
              assert path.is_file(), path
              assert path.stat().st_size == asset['bytes'], path
          print('AMT browser package verified')
          PY

      - name: Publish AMT-S browser model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=browser-amt-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Browser AMT-S v1" \
              --notes "Browser-ready ONNX export of MCG-NKU/AMT AMT-S. Upstream licence: CC BY-NC 4.0. Generated from the official source and checkpoint by browser/export/export_amt.py."
          fi
          gh release upload "$tag" /tmp/browser-amt-v1/* --clobber

  resshift:
    name: Export ResShift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebP Animator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.6.0 \
            torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            onnx==1.17.0 \
            huggingface-hub==0.30.2 \
            safetensors>=0.4.5 \
            kornia==0.8.0 \
            einops==0.8.0 \
            matplotlib>=3.8 \
            cupy-cuda12x>=13.0

      - name: Fetch official ResShift source and checkpoint
        run: |
          git clone --depth 1 https://github.com/VicFonch/Multi-Input-Resshift-Diffusion-VFI.git /tmp/ResShift
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='vfontech/Multiple-Input-Resshift-VFI',
              local_dir='/tmp/ResShift-model',
          )
          PY
          git -C /tmp/ResShift rev-parse HEAD
          sha256sum /tmp/ResShift-model/model.safetensors

      - name: Export ResShift browser graphs
        run: |
          rm -rf /tmp/browser-resshift-v1
          python browser/export/export_resshift.py \
            --source /tmp/ResShift \
            --model-dir /tmp/ResShift-model \
            --output /tmp/browser-resshift-v1

      - name: Include upstream licence
        run: cp /tmp/ResShift/LICENSE /tmp/browser-resshift-v1/LICENSE-RESSHIFT.txt

      - name: Verify model package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/browser-resshift-v1')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['family'] == 'resshift'
          assert manifest['licence'] == 'MIT'
          assert set(manifest['components']) == {'flow', 'extractor', 'synthesis'}
          for asset in manifest['assets']:
              path = root / asset['path']
              assert path.is_file(), path
              assert path.stat().st_size == asset['bytes'], path
          print('ResShift browser package verified')
          PY

      - name: Publish ResShift browser model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=browser-resshift-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Browser ResShift v1" \
              --notes "Browser-ready ONNX export of VicFonch/Multi-Input-Resshift-Diffusion-VFI. Upstream licence: MIT. Generated from the official Hugging Face checkpoint by browser/export/export_resshift.py."
          fi
          gh release upload "$tag" /tmp/browser-resshift-v1/* --clobber

  eden:
    name: Export EDEN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebP Animator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            onnx==1.17.0 \
            PyYAML==6.0.2 \
            einops==0.7.0 \
            lpips==0.1.4 \
            opencv-python-headless==4.10.0.84

      - name: Fetch official EDEN source and checkpoint
        run: |
          git clone --depth 1 https://github.com/bbldCVer/EDEN.git /tmp/EDEN
          curl --fail --location --retry 3 \
            https://huggingface.co/zhZ524/EDEN/resolve/main/eden.pt \
            --output /tmp/EDEN/eden.pt
          git -C /tmp/EDEN rev-parse HEAD
          sha256sum /tmp/EDEN/eden.pt

      - name: Export EDEN browser graph
        run: |
          rm -rf /tmp/browser-eden-v1
          python browser/export/export_eden.py \
            --source /tmp/EDEN \
            --config /tmp/EDEN/configs/eval_eden.yaml \
            --checkpoint /tmp/EDEN/eden.pt \
            --output /tmp/browser-eden-v1

      - name: Include upstream licence
        run: cp /tmp/EDEN/LICENSE /tmp/browser-eden-v1/LICENSE-EDEN.txt

      - name: Verify model package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/browser-eden-v1')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['family'] == 'eden'
          assert manifest['licence'] == 'Apache-2.0'
          assert set(manifest['components']) == {'generator'}
          for asset in manifest['assets']:
              path = root / asset['path']
              assert path.is_file(), path
              assert path.stat().st_size == asset['bytes'], path
          print('EDEN browser package verified')
          PY

      - name: Publish EDEN browser model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=browser-eden-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Browser EDEN v1" \
              --notes "Browser-ready ONNX export of bbldCVer/EDEN. Upstream licence: Apache-2.0. Generated from the official checkpoint by browser/export/export_eden.py."
          fi
          gh release upload "$tag" /tmp/browser-eden-v1/* --clobber
